# Pubblica l'app su Cloudflare a ogni merge su main.
# Si può anche lanciare a mano: GitHub → Actions → "Deploy su Cloudflare" → Run workflow.
# Richiede i secret del repository CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
name: Deploy su Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un deploy alla volta: un nuovo merge attende che il precedente finisca
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Controllo dei tipi
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Migrazioni del database D1
        run: npx wrangler d1 migrations apply rf-coaching-db --remote

      - name: Pubblicazione del Worker
        run: npx wrangler deploy
